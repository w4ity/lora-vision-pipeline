[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lora-vision-pipeline"
version = "0.1.0"
description = "Reproducible LoRA fine-tuning pipeline for vision backbones (ViT-B/16, ResNet) with rigorous evaluation, stress benchmarks, forgetting probes, experiment tracking and A/B serving."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "torch>=2.5",
    "torchvision>=0.20",
    "peft>=0.14",
    "mlflow>=2.16",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pillow>=10.4",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "matplotlib>=3.8",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
