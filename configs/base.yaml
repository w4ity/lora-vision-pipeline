# Base configuration. Every experiment inherits from this file via `inherit: base.yaml`
# and only overrides what changes. One YAML = one reproducible run.

name: base
seed: 42
device: auto          # auto | cuda | cpu  (auto picks CUDA if available)
output_dir: outputs

data:
  name: eurosat       # eurosat (default) | cifar10 | flowers102
  root: data
  img_size: 224       # EuroSAT tiles are 64px; they are resized up (fine for both backbones)
  batch_size: 32
  num_workers: 4
  train_frac: 0.8
  val_frac: 0.1       # test gets the remaining 0.1
  pin_memory: true
  download: true

model:
  backbone: vit_b_16  # vit_b_16 | resnet50 | resnet18
  pretrained: true
  method: lora        # lora | linear_probe

lora:
  rank: 16
  alpha: 32           # convention: alpha = 2 * rank
  dropout: 0.05
  target_modules: null  # null -> backbone-specific default (see models/lora.py)

train:
  # NOTE: scientific notation needs a decimal point in YAML 1.1 (2e-4 would parse as a
  # string); config.py also coerces these defensively.
  lr: 2.0e-4          # LoRA/adapter learning rate
  head_lr: 1.0e-3     # classification head (new parameters) learns faster
  weight_decay: 0.01
  epochs: 5
  warmup_epochs: 0.5
  label_smoothing: 0.0
  grad_clip: 1.0
  amp: true           # mixed precision on CUDA
  early_stopping_patience: 3
  max_steps_per_epoch: null  # set an int for fast smoke runs

eval:
  batch_size: 64
  corruption_severities: [1, 3, 5]

tracking:
  backend: mlflow     # mlflow | none
  tracking_uri: sqlite:///mlflow.db   # MLflow 3.x deprecated the 'mlruns' file store
  experiment_name: lora-vision-eurosat
